# Builds Shoebox for Windows, macOS and Linux, tests each build (and the Windows installer + uninstaller),
# and keeps the downloads as artifacts. A tag like v1.0.0 (matching shoebox/__init__.py) makes a release.
name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install PySide6 pillow pillow-heif python-mpv pyinstaller
      - name: ffmpeg and libmpv to bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe packaging/bin/
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --output mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev
          Copy-Item mpv-dev/libmpv-2.dll packaging/bin/
      - name: Build the app
        run: python packaging/build.py
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist/Shoebox/Shoebox.exe -ArgumentList "--selftest", "$PWD/selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode
      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Select-String -Path shoebox/__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DVersion=$v" packaging\shoebox.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test install, run, uninstall
        shell: pwsh
        run: |
          $p = Start-Process dist/Shoebox-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode) { throw "installer failed: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Shoebox"
          if (-not (Test-Path "$app\Shoebox.exe")) { throw "not installed in $app" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Shoebox.lnk"
          if (-not $lnk) { throw "no Start menu shortcut" }
          $reg = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq "Shoebox"
          if (-not $reg) { throw "not in Add or remove programs" }
          "installed: $app, shortcut $($lnk.FullName), uninstall entry $($reg.DisplayVersion)"
          $t = Start-Process "$app\Shoebox.exe" -ArgumentList "--selftest", "$PWD/installed-selftest.txt" -Wait -PassThru
          Get-Content installed-selftest.txt
          if ($t.ExitCode) { throw "installed app failed its self-test" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          Start-Sleep 5
          if (Test-Path "$app\Shoebox.exe") { throw "uninstall left the app behind" }
          if (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Shoebox.lnk") { throw "uninstall left the shortcut" }
          "uninstalled cleanly"
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive dist/Shoebox Shoebox-Windows.zip
          Copy-Item dist/Shoebox-Setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Shoebox-Windows
          path: |
            Shoebox-Setup.exe
            Shoebox-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install PySide6 pillow pillow-heif python-mpv pyinstaller
      - name: ffmpeg and libmpv to bundle
        run: |
          brew install mpv ffmpeg
          mkdir -p packaging/bin
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" "$(brew --prefix ffmpeg)/bin/ffprobe" packaging/bin/
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" packaging/bin/libmpv.dylib
      - name: Build
        run: python packaging/build.py
      - name: Self-test the built app
        run: |
          dist/Shoebox.app/Contents/MacOS/Shoebox --selftest "$PWD/selftest.txt"; code=$?
          cat selftest.txt
          exit $code
      - name: Disk image (drag Shoebox into Applications)
        run: |
          mkdir dmg && cp -R dist/Shoebox.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Shoebox -srcfolder dmg -ov -format UDZO Shoebox-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Shoebox-macOS
          path: Shoebox-macOS.dmg

  linux:  # Linux installs from source with install.sh (a prebuilt bundle clashes with newer system libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages (what a user would have)
        run: sudo apt-get update -q && sudo apt-get install -yq python3-venv libmpv2 ffmpeg libegl1 libxkbcommon0
      - name: Test install.sh, run, uninstall
        run: |
          git archive --format=tar.gz --prefix=shoebox/ -o /tmp/src.tar.gz HEAD
          SHOEBOX_SOURCE=/tmp/src.tar.gz sh install.sh
          ~/.local/bin/shoebox --selftest "$PWD/selftest.txt"; code=$?
          cat selftest.txt
          test $code -eq 0
          sh install.sh --uninstall
          test ! -e ~/.local/share/shoebox

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in the code
        run: |
          v=$(sed -E 's/.*"(.+)".*/\1/' shoebox/__init__.py)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but the code says $v"; exit 1; }
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: Shoebox ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          files: |
            Shoebox-Windows/Shoebox-Setup.exe
            Shoebox-Windows/Shoebox-Windows.zip
            Shoebox-macOS/Shoebox-macOS.dmg
