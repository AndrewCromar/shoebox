# Builds Shoebox for Windows and macOS, runs its self-test on each, and uploads the apps.
# A tag like v1.0 also makes a GitHub release with the downloads attached.
name: build

on:
  push:
    branches: [main, dev, platforms]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install PySide6 pillow pillow-heif python-mpv pyinstaller
      - name: ffmpeg and libmpv to bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe packaging/bin/
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --output mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev
          Copy-Item mpv-dev/libmpv-2.dll packaging/bin/
          Get-ChildItem packaging/bin
      - name: Build
        run: python packaging/build.py
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist/Shoebox/Shoebox.exe -ArgumentList "--selftest", "$PWD/selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode
      - name: Zip
        shell: pwsh
        run: Compress-Archive dist/Shoebox Shoebox-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shoebox-Windows
          path: Shoebox-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install PySide6 pillow pillow-heif python-mpv pyinstaller
      - name: ffmpeg and libmpv to bundle
        run: |
          brew install mpv ffmpeg
          mkdir -p packaging/bin
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" "$(brew --prefix ffmpeg)/bin/ffprobe" packaging/bin/
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" packaging/bin/libmpv.dylib
          ls -la packaging/bin
      - name: Build
        run: python packaging/build.py
      - name: Self-test the built app
        run: |
          dist/Shoebox.app/Contents/MacOS/Shoebox --selftest "$PWD/selftest.txt"; code=$?
          cat selftest.txt
          exit $code
      - name: Zip
        run: ditto -c -k --keepParent dist/Shoebox.app Shoebox-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shoebox-macOS
          path: Shoebox-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Shoebox-Windows/Shoebox-Windows.zip
            Shoebox-macOS/Shoebox-macOS.zip
